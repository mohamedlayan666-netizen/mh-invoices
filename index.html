<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#172554">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>فواتيري الذكي – MH</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#172554;--sky:#0EA5E9;--teal:#14B8A6;--vio:#8B5CF6;--org:#F59E0B;--red:#DC2626;--bg:#F8FAFC;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=x]{}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c31;--tx:#e8eefc;--mu:#94a3b8;--bd:#24304d}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tajawal,system-ui,sans-serif;padding-bottom:84px}
header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
header b{font-size:18px}header small{display:block;opacity:.8;font-size:12px}
main{padding:14px;max-width:720px;margin:auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001;border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:16px;padding:12px;color:#fff}.stat b{display:block;font-size:18px}.stat span{font-size:12px;opacity:.9}
button,.btn{font-family:inherit;border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;background:var(--sky);color:#fff;cursor:pointer;min-height:44px}
.b2{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.bt{background:var(--teal)}.bv{background:var(--vio)}.bo{background:var(--org)}.br{background:var(--red)}
.q{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;font-size:13px}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav a{flex:1;text-align:center;padding:9px 2px;font-size:12px;color:var(--mu);cursor:pointer}nav a.on{color:var(--sky);font-weight:700}nav a i{display:block;font-style:normal;font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;padding:3px 8px;border-radius:20px;color:#fff;background:var(--mu)}
.t-paid,.t-accepted,.t-received{background:var(--teal)}.t-late,.t-rejected{background:var(--org)}.t-cancelled{background:var(--red)}.t-issued,.t-sent{background:var(--sky)}.t-partial{background:var(--vio)}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.mod{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mod>div{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px;max-height:88vh;overflow:auto}
.toast{position:fixed;bottom:96px;inset-inline:16px;margin:auto;max-width:420px;background:var(--navy);color:#fff;padding:12px;border-radius:12px;text-align:center;z-index:30}
.it{border:1px dashed var(--bd);border-radius:12px;padding:8px;margin-bottom:8px}
.it .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.doc{background:#fff;color:#111;padding:18px;border-radius:8px;border:1px solid var(--bd)}
.doc table{width:100%;border-collapse:collapse;font-size:13px}.doc th{background:var(--navy);color:#fff;padding:6px}.doc td{padding:6px;border-bottom:1px solid #e5e7eb;text-align:center}
.doc h2{margin:0;color:var(--navy)}.sum{margin-top:10px;margin-inline-start:auto;width:60%;font-size:13px}.sum div{display:flex;justify-content:space-between;padding:3px 0}
.fine{font-size:11px;color:var(--mu)}
.sec{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--sky);margin-bottom:8px}.sec i{font-style:normal;background:#e0f2fe;border-radius:10px;padding:5px 7px}.tbar{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;position:sticky;bottom:72px;z-index:4;margin-bottom:10px;font-size:16px;box-shadow:0 4px 14px #0004}.it{background:var(--bg)}.doc .hd{background:var(--navy);color:#fff;margin:-18px -18px 14px;padding:16px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.doc .hd h2{color:#fff}.doc .hd img{height:56px;max-width:130px;object-fit:contain;background:#fff;border-radius:8px;padding:4px}.doc .meta{display:flex;gap:8px;background:#f1f5f9;border-radius:10px;padding:10px;font-size:12px;margin:10px 0;color:#475569}.doc .meta div{flex:1}.doc .meta b{color:#111;font-size:13px}.doc tr:nth-child(even) td{background:#f8fafc}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}@media print{header,nav,.np,body::before{display:none!important}body{background:#fff;padding:0}.doc{border:0}@page{size:A4;margin:12mm}}
</style>
</head>
<body>
<header class="row"><div><b>فواتيري الذكي – MH</b><small>حلول ذكية للأعمال</small></div><img id="hl" alt="" style="height:38px;max-width:90px;object-fit:contain;border-radius:8px;background:#fff;padding:2px;display:none"></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const TN={inv:'فاتورة',quo:'عرض سعر',po:'أمر شراء'};
const ST={inv:{draft:'مسودة',issued:'صادرة',partial:'مدفوعة جزئيًا',paid:'مدفوعة',late:'متأخرة',cancelled:'ملغاة'},quo:{draft:'مسودة',sent:'مرسل',accepted:'مقبول',rejected:'مرفوض',expired:'منتهي'},po:{draft:'مسودة',sent:'مرسل',received:'مستلم',cancelled:'ملغى'}};
let S={set:{name:'',phone:'',email:'',addr:'',tax:14,cur:'ج.م',terms:'الدفع خلال 7 أيام من تاريخ الفاتورة',foot:''},cus:[],prd:[],docs:[],rcp:[],n:{inv:0,quo:0,po:0,rin:0,rout:0}};
let tab='home',E=null,dirty=false,db=null,mem=null,filt='all',q='';
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const c2=v=>Math.round((parseFloat(v)||0)*100);
const fm=c=>(c/100).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+esc(S.set.cur);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
// ---- storage (IndexedDB) ----
function idb(){return new Promise(r=>{try{const o=indexedDB.open('mh',1);o.onupgradeneeded=()=>o.result.createObjectStore('kv');o.onsuccess=()=>{db=o.result;r()};o.onerror=()=>r()}catch(e){r()}})}
function load(){return new Promise(r=>{if(!db)return r();try{const g=db.transaction('kv').objectStore('kv').get('s');g.onsuccess=()=>{if(g.result)S=Object.assign(S,g.result);r()};g.onerror=()=>r()}catch(e){r()}})}
function save(){mem=JSON.stringify(S);if(!db)return;try{db.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(mem),'s')}catch(e){toast('تعذر الحفظ المحلي')}}
// ---- calc (integer cents) ----
function calc(d){let sub=0;d.items.forEach(i=>{i.t=Math.max(0,Math.round(i.q*i.p)-i.d);sub+=i.t});const dc=Math.min(d.disc||0,sub);const base=sub-dc;const tax=d.taxOn?Math.round(base*d.taxRate/100):0;const total=base+tax;const paid=(d.pays||[]).reduce((a,p)=>a+p.a,0);return{sub,dc,tax,total,paid,rest:Math.max(0,total-paid)}}
function cname(id){const c=S.cus.find(x=>x.id==id);return c?c.name:'—'}
function autoStatus(d){if(d.type!=='inv'||['draft','cancelled'].includes(d.status))return;const k=calc(d);if(k.total>0&&k.paid>=k.total)d.status='paid';else if(k.paid>0)d.status='partial';else d.status=(d.due&&d.due<today())?'late':'issued'}
// ---- modal ----
function dlg(title,html,ok,okTxt='حفظ'){const m=document.createElement('div');m.className='mod';m.innerHTML=`<div><h3>${title}</h3>${html}<div class="row" style="margin-top:14px"><button class="b2" id="mx">إلغاء</button>${ok?`<button id="mo">${okTxt}</button>`:''}</div></div>`;document.body.appendChild(m);$('#mx').onclick=()=>m.remove();if(ok)$('#mo').onclick=()=>{if(ok(m)!==false)m.remove()};return m}
const fv=(m,k)=>m.querySelector('[name='+k+']').value;
// ---- views ----
function nav(){const t=[['home','🏠','الرئيسية'],['docs','📄','المستندات'],['cus','👥','العملاء'],['prd','📦','المنتجات'],['more','⚙️','المزيد']];$('#nav').innerHTML=t.map(x=>`<a class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</a>`).join('')}
function go(t){if(dirty&&!confirm('لديك تغييرات غير محفوظة. هل تريد المغادرة؟'))return;dirty=false;E=null;tab=t;render()}
function render(){nav();const hl=$('#hl');if(hl){if(S.set.logo){hl.src=S.set.logo;hl.style.display='block'}else hl.style.display='none'}const v={home:vHome,docs:vDocs,cus:vCus,prd:vPrd,more:vMore,edit:vEdit,prev:vPrev,rcp:vRcp,rview:vRview}[tab];$('#app').innerHTML=v();scrollTo(0,0)}
function vHome(){const inv=S.docs.filter(d=>d.type==='inv'&&d.status!=='cancelled'&&d.status!=='draft');let tot=0,paid=0;inv.forEach(d=>{const k=calc(d);tot+=k.total;paid+=k.paid});const qo=S.docs.filter(d=>d.type==='quo'&&['draft','sent'].includes(d.status)).length;
const rec=[...S.docs].sort((a,b)=>b.cr-a.cr).slice(0,5);
return `<div class="grid"><div class="stat" style="background:var(--navy)"><span>إجمالي الفواتير</span><b>${fm(tot)}</b></div><div class="stat" style="background:var(--teal)"><span>المحصّل</span><b>${fm(paid)}</b></div><div class="stat" style="background:var(--org)"><span>المستحق</span><b>${fm(Math.max(0,tot-paid))}</b></div><div class="stat" style="background:var(--vio)"><span>العملاء / الفواتير / عروض مفتوحة</span><b>${S.cus.length} / ${inv.length} / ${qo}</b></div></div>
<h3>وصول سريع</h3><div class="grid" style="grid-template-columns:repeat(3,1fr)"><button class="q" onclick="newDoc('inv')">🧾<span>فاتورة</span></button><button class="q bt" onclick="newDoc('quo')">📝<span>عرض سعر</span></button><button class="q bv" onclick="newDoc('po')">🛒<span>أمر شراء</span></button><button class="q b2" onclick="cusForm()">👤<span>عميل</span></button><button class="q b2" onclick="prdForm()">📦<span>منتج/خدمة</span></button><button class="q bo" onclick="go('more')">📊<span>التقارير</span></button><button class="q b2" onclick="rcpForm('in')">💵<span>إيصال قبض</span></button><button class="q b2" onclick="rcpForm('out')">💸<span>إيصال صرف</span></button></div>
<h3>أحدث المستندات</h3>${rec.length?rec.map(dRow).join(''):'<div class="card empty">لا توجد مستندات بعد. ابدأ بإنشاء فاتورة.</div>'}`}
function dRow(d){const k=calc(d);return `<div class="card" onclick="openDoc('${d.id}')"><div class="row"><b>${TN[d.type]} ${d.no}</b><span class="tag t-${d.status}">${ST[d.type][d.status]}</span></div><div class="row fine"><span>${esc(cname(d.cid))} • ${d.date}</span><b style="font-size:14px;color:var(--tx)">${fm(k.total)}</b></div></div>`}
function vDocs(){let l=S.docs.filter(d=>(filt=='all'||d.type==filt)&&(!q||(cname(d.cid)+d.no).includes(q))).sort((a,b)=>b.cr-a.cr);
return `<div class="row np"><input placeholder="بحث بالعميل أو الرقم" value="${esc(q)}" oninput="q=this.value;renderList()"><select style="width:110px" onchange="filt=this.value;render()"><option value="all">الكل</option>${Object.entries(TN).map(([k,v])=>`<option value="${k}" ${filt==k?'selected':''}>${v}</option>`).join('')}</select></div>
<div class="grid" style="margin:10px 0;grid-template-columns:repeat(3,1fr)"><button onclick="newDoc('inv')">+ فاتورة</button><button class="bt" onclick="newDoc('quo')">+ عرض</button><button class="bv" onclick="newDoc('po')">+ أمر شراء</button></div><div id="dl">${l.length?l.map(dRow).join(''):'<div class="card empty">لا توجد مستندات مطابقة.</div>'}</div>`}
function renderList(){const l=S.docs.filter(d=>(filt=='all'||d.type==filt)&&(!q||(cname(d.cid)+d.no).includes(q))).sort((a,b)=>b.cr-a.cr);$('#dl').innerHTML=l.length?l.map(dRow).join(''):'<div class="card empty">لا توجد مستندات مطابقة.</div>'}
function vCus(){return `<button onclick="cusForm()" style="width:100%;margin-bottom:10px">+ إضافة عميل</button><input placeholder="بحث عن عميل" oninput="q=this.value;$('#cl').innerHTML=cl()">${'<div id="cl" style="margin-top:10px">'+cl()+'</div>'}`}
function cl(){const l=S.cus.filter(c=>!q||(c.name+(c.phone||'')).includes(q));return l.length?l.map(c=>{const ds=S.docs.filter(d=>d.cid==c.id);return `<div class="card" style="${c.off?'opacity:.55':''}"><div class="row"><b>${esc(c.name)} ${c.off?'(معطّل)':''}</b><span class="fine">${ds.length} مستند</span></div><div class="fine">${esc(c.phone||'')} ${esc(c.addr||'')}</div><div class="row" style="margin-top:8px"><button class="b2" onclick="cusForm('${c.id}')">تعديل</button><button class="b2" onclick="cusDel('${c.id}')">حذف/تعطيل</button></div></div>`}).join(''):'<div class="card empty">لا يوجد عملاء. أضف أول عميل.</div>'}
function cusForm(id){const c=S.cus.find(x=>x.id==id)||{};dlg(id?'تعديل عميل':'عميل جديد',`<label>الاسم *</label><input name="name" value="${esc(c.name)}"><label>الهاتف</label><input name="phone" type="tel" value="${esc(c.phone)}"><label>البريد (اختياري)</label><input name="email" value="${esc(c.email)}"><label>العنوان</label><input name="addr" value="${esc(c.addr)}"><label>الرقم الضريبي (اختياري)</label><input name="tax" value="${esc(c.tax)}">`,m=>{const n=fv(m,'name').trim();if(!n){toast('الاسم مطلوب');return false}const o=c.id?c:{id:uid()};Object.assign(o,{name:n,phone:fv(m,'phone'),email:fv(m,'email'),addr:fv(m,'addr'),tax:fv(m,'tax')});if(!c.id)S.cus.push(o);save();toast('تم الحفظ ✓');render()})}
function cusDel(id){const c=S.cus.find(x=>x.id==id);if(S.docs.some(d=>d.cid==id)||S.rcp.some(d=>d.cid==id)){if(confirm('هذا العميل مرتبط بمستندات ولا يمكن حذفه. هل تريد تعطيله بدلًا من ذلك؟')){c.off=!c.off;save();render()}}else if(confirm('حذف العميل نهائيًا؟')){S.cus=S.cus.filter(x=>x.id!=id);save();render()}}
function vPrd(){return `<button onclick="prdForm()" style="width:100%;margin-bottom:10px">+ إضافة منتج أو خدمة</button>${S.prd.length?S.prd.map(p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b><b>${fm(p.p)}</b></div><div class="fine">${esc(p.unit||'')} ${esc(p.cat||'')} ${esc(p.code||'')}</div><div class="row" style="margin-top:8px"><button class="b2" onclick="prdForm('${p.id}')">تعديل</button><button class="b2" onclick="if(confirm('حذف؟')){S.prd=S.prd.filter(x=>x.id!='${p.id}');save();render()}">حذف</button></div></div>`).join(''):'<div class="card empty">لا توجد منتجات أو خدمات بعد.</div>'}`}
function prdForm(id){const p=S.prd.find(x=>x.id==id)||{};dlg(id?'تعديل':'منتج / خدمة',`<label>الاسم *</label><input name="name" value="${esc(p.name)}"><label>الوصف</label><input name="desc" value="${esc(p.desc)}"><label>سعر البيع</label><input name="p" type="number" inputmode="decimal" value="${p.p?p.p/100:''}"><label>الوحدة</label><input name="unit" value="${esc(p.unit)}" placeholder="قطعة / ساعة"><label>التصنيف</label><input name="cat" value="${esc(p.cat)}"><label>الكود (اختياري)</label><input name="code" value="${esc(p.code)}">`,m=>{const n=fv(m,'name').trim();if(!n){toast('الاسم مطلوب');return false}const o=p.id?p:{id:uid()};Object.assign(o,{name:n,desc:fv(m,'desc'),p:c2(fv(m,'p')),unit:fv(m,'unit'),cat:fv(m,'cat'),code:fv(m,'code')});if(!p.id)S.prd.push(o);save();toast('تم الحفظ ✓');render()})}
// ---- editor ----
function newDoc(t){const s=S.set;E={id:uid(),type:t,no:'',date:today(),due:'',cid:'',items:[{n:'',q:1,p:0,d:0}],disc:0,taxOn:false,taxRate:s.tax,status:'draft',pays:[],notes:s.terms,cr:Date.now(),isNew:true};dirty=false;tab='edit';render()}
function openDoc(id){E=JSON.parse(JSON.stringify(S.docs.find(d=>d.id==id)));tab='prev';render()}
function vEdit(){const d=E,t=d.type;return `<div class="card"><div class="sec"><i>📋</i>${d.isNew?'جديد: ':'تعديل: '}${TN[t]} ${d.no||''}</div>
<label>${t=='po'?'المورد':'العميل'}</label><div class="row"><select name="cid" onchange="E.cid=this.value;dirty=true" style="flex:1"><option value="">— اختر —</option>${S.cus.filter(c=>!c.off||c.id==d.cid).map(c=>`<option value="${c.id}" ${c.id==d.cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="b2" onclick="quickCus()">+</button></div>
<div class="grid"><div><label>التاريخ</label><input type="date" value="${d.date}" onchange="E.date=this.value;dirty=true"></div><div><label>${t=='quo'?'انتهاء الصلاحية':t=='po'?'التسليم المتوقع':'الاستحقاق'}</label><input type="date" value="${d.due}" onchange="E.due=this.value;dirty=true"></div></div>
<label>الحالة</label><select onchange="E.status=this.value;dirty=true">${Object.entries(ST[t]).map(([k,v])=>`<option value="${k}" ${d.status==k?'selected':''}>${v}</option>`).join('')}</select></div>
<div class="card"><div class="sec"><i>🧮</i>البنود</div><datalist id="pl">${S.prd.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist><div id="its" style="margin-top:8px">${itemsH()}</div><button class="b2" style="width:100%" onclick="E.items.push({n:'',q:1,p:0,d:0});dirty=true;$('#its').innerHTML=itemsH()">+ إضافة بند</button></div>
<div class="card"><div class="sec"><i>💰</i>الخصم والضريبة</div><div class="grid"><div><label>خصم على المستند</label><input type="number" inputmode="decimal" value="${d.disc?d.disc/100:''}" oninput="E.disc=c2(this.value);dirty=true;tot()"></div><div><label>الضريبة %</label><input type="number" inputmode="decimal" value="${d.taxRate}" oninput="E.taxRate=parseFloat(this.value)||0;dirty=true;tot()"></div></div><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" style="width:auto" ${d.taxOn?'checked':''} onchange="E.taxOn=this.checked;dirty=true;tot()">تفعيل الضريبة</label><div id="tt"></div><label>شروط وملاحظات</label><textarea rows="2" oninput="E.notes=this.value;dirty=true">${esc(d.notes)}</textarea></div>
<div class="tbar" id="tb"></div><div class="row"><button class="b2" onclick="go('docs')">إلغاء</button><button class="bt" style="flex:1" onclick="saveDoc()">حفظ ومعاينة</button></div>`}
function itemsH(){return E.items.map((i,x)=>`<div class="it"><div class="fine">بند ${x+1}</div><input list="pl" placeholder="اسم المنتج أو الخدمة" value="${esc(i.n)}" onchange="pick(${x},this.value)"><div class="g"><div><label>الكمية</label><input type="number" inputmode="decimal" value="${i.q}" oninput="E.items[${x}].q=parseFloat(this.value)||0;dirty=true;tot()"></div><div><label>السعر</label><input id="p${x}" type="number" inputmode="decimal" value="${i.p?i.p/100:''}" oninput="E.items[${x}].p=c2(this.value);dirty=true;tot()"></div><div><label>خصم</label><input type="number" inputmode="decimal" value="${i.d?i.d/100:''}" oninput="E.items[${x}].d=c2(this.value);dirty=true;tot()"></div></div><button class="b2" style="margin-top:6px;color:var(--red)" onclick="E.items.splice(${x},1);if(!E.items.length)E.items.push({n:'',q:1,p:0,d:0});$('#its').innerHTML=itemsH();tot()">حذف البند</button></div>`).join('')+(setTimeout(tot,0),'')}
function pick(x,v){E.items[x].n=v;dirty=true;const p=S.prd.find(z=>z.name==v);if(p){E.items[x].p=p.p;E.items[x].desc=p.desc;$('#p'+x).value=p.p/100;tot()}}
function tot(){const k=calc(E),el=$('#tt'),tb=$('#tb');if(tb)tb.innerHTML=`<span>الإجمالي النهائي</span><b>${fm(k.total)}</b>`;if(el)el.innerHTML=`<div class="row" style="margin-top:8px"><span>الإجمالي الفرعي</span><span>${fm(k.sub)}</span></div><div class="row"><span>الخصم</span><span>${fm(k.dc)}</span></div><div class="row"><span>الضريبة</span><span>${fm(k.tax)}</span></div><div class="row"><b>الإجمالي النهائي</b><b style="color:var(--sky)">${fm(k.total)}</b></div>`}
function quickCus(){dlg('عميل جديد','<label>الاسم *</label><input name="name"><label>الهاتف</label><input name="phone" type="tel">',m=>{const n=fv(m,'name').trim();if(!n){toast('الاسم مطلوب');return false}const c={id:uid(),name:n,phone:fv(m,'phone')};S.cus.push(c);save();E.cid=c.id;dirty=true;const keep=E;render();E=keep})}
function saveDoc(){if(!E.cid){toast('اختر العميل أولًا');return}if(!E.items.some(i=>i.n.trim())){toast('أضف بندًا واحدًا على الأقل');return}if(E.isNew){E.no=String(++S.n[E.type]).padStart(4,'0');delete E.isNew;S.docs.push(E)}else S.docs[S.docs.findIndex(x=>x.id==E.id)]=E;autoStatus(E);save();dirty=false;toast('تم الحفظ ✓');tab='prev';render()}
function vPrev(){const d=E,s=S.set,k=calc(d);return `<div class="np row" style="margin-bottom:10px;flex-wrap:wrap"><button class="b2" onclick="go('docs')">رجوع</button><button class="b2" onclick="tab='edit';render()">تعديل</button><button onclick="print()">طباعة / PDF</button></div><div class="np row" style="margin-bottom:10px;flex-wrap:wrap">${d.type=='inv'?`<button class="bt" onclick="payF()">+ دفعة</button>`:''}${d.type=='quo'?`<button class="bv" onclick="toInv()">تحويل إلى فاتورة</button>`:''}<button class="b2" style="color:var(--red)" onclick="delDoc()">حذف</button></div>
<div class="doc"><div class="hd"><div><h2>${esc(s.name||'اسم الشركة')}</h2><div style="font-size:12px;opacity:.85">${esc(s.phone)} ${esc(s.email)}<br>${esc(s.addr)}</div></div>${s.logo?`<img src="${s.logo}" alt="">`:''}</div><div class="row"><h3 style="margin:0;color:var(--navy)">${TN[d.type]} رقم ${d.no}</h3><span class="tag t-${d.status}">${ST[d.type][d.status]}</span></div><div class="meta"><div>${d.type=='po'?'المورد':'العميل'}<br><b>${esc(cname(d.cid))}</b></div><div>التاريخ<br><b>${d.date}</b></div>${d.due?`<div>${d.type=='quo'?'الصلاحية':'الاستحقاق'}<br><b>${d.due}</b></div>`:''}</div>
<table><tr><th>البند</th><th>الكمية</th><th>السعر</th><th>الخصم</th><th>الإجمالي</th></tr>${d.items.filter(i=>i.n.trim()).map(i=>`<tr><td>${esc(i.n)}</td><td>${i.q}</td><td>${fm(i.p)}</td><td>${fm(i.d)}</td><td>${fm(i.t)}</td></tr>`).join('')}</table>
<div class="sum"><div><span>الإجمالي الفرعي</span><span>${fm(k.sub)}</span></div>${k.dc?`<div><span>خصم</span><span>${fm(k.dc)}</span></div>`:''}${d.taxOn?`<div><span>ضريبة ${d.taxRate}%</span><span>${fm(k.tax)}</span></div>`:''}<div><b>الإجمالي</b><b>${fm(k.total)}</b></div>${d.type=='inv'?`<div><span>المدفوع</span><span>${fm(k.paid)}</span></div><div><b style="color:#b45309">المتبقي</b><b style="color:#b45309">${fm(k.rest)}</b></div>`:''}</div>
${d.notes?`<p class="fine">${esc(d.notes)}</p>`:''}<p class="fine" style="text-align:center;border-top:1px solid #e5e7eb;padding-top:8px">${esc(s.foot)} فواتيري الذكي – MH</p></div>
${(d.pays||[]).length?`<div class="card np"><b>الدفعات</b>${d.pays.map(p=>`<div class="row fine"><span>${p.d}</span><span>${fm(p.a)}</span></div>`).join('')}</div>`:''}`}
function payF(){const k=calc(E);dlg('تسجيل دفعة',`<div class="fine">المتبقي: ${fm(k.rest)}</div><label>المبلغ</label><input name="a" type="number" inputmode="decimal"><label>التاريخ</label><input name="d" type="date" value="${today()}">`,m=>{const a=c2(fv(m,'a'));if(a<=0||a>k.rest){toast('المبلغ غير صحيح أو أكبر من المتبقي');return false}E.pays.push({a,d:fv(m,'d')});if(E.status=='draft')E.status='issued';autoStatus(E);S.docs[S.docs.findIndex(x=>x.id==E.id)]=E;save();toast('تم تسجيل الدفعة ✓');render()})}
function toInv(){if(!confirm('تحويل عرض السعر إلى فاتورة؟'))return;const o=JSON.parse(JSON.stringify(E));Object.assign(o,{id:uid(),type:'inv',no:String(++S.n.inv).padStart(4,'0'),status:'issued',pays:[],cr:Date.now(),date:today(),due:''});S.docs.push(o);E.status='accepted';S.docs[S.docs.findIndex(x=>x.id==E.id)]=E;save();E=o;toast('تم إنشاء الفاتورة ✓');render()}
function delDoc(){if(confirm('حذف هذا المستند نهائيًا؟')){S.docs=S.docs.filter(x=>x.id!=E.id);save();tab='docs';E=null;render()}}
// ---- receipts ----
const MT={cash:'نقدي',bank:'تحويل بنكي',other:'أخرى'};let rf='all',R=null;
function rc(k){return S.rcp.filter(r=>r.kind==k).reduce((a,r)=>a+r.amt,0)}
function vRcp(){const l=S.rcp.filter(r=>rf=='all'||r.kind==rf).sort((a,b)=>b.cr-a.cr);return `<div class="grid np"><button class="bt" onclick="rcpForm('in')">+ إيصال قبض</button><button class="bo" onclick="rcpForm('out')">+ إيصال صرف</button></div><div class="card" style="margin-top:10px"><div class="row"><span>إجمالي المقبوض</span><b style="color:var(--teal)">${fm(rc('in'))}</b></div><div class="row"><span>إجمالي المصروف</span><b style="color:var(--org)">${fm(rc('out'))}</b></div></div><select onchange="rf=this.value;render()" style="margin-bottom:10px"><option value="all" ${rf=='all'?'selected':''}>كل الإيصالات</option><option value="in" ${rf=='in'?'selected':''}>القبض فقط</option><option value="out" ${rf=='out'?'selected':''}>الصرف فقط</option></select>${l.length?l.map(r=>`<div class="card" onclick="viewR('${r.id}')"><div class="row"><b>${r.kind=='in'?'إيصال قبض':'إيصال صرف'} ${r.no}</b><b style="color:${r.kind=='in'?'var(--teal)':'var(--org)'}">${fm(r.amt)}</b></div><div class="fine">${esc(cname(r.cid))} • ${r.date} • ${MT[r.m]||''}</div></div>`).join(''):'<div class="card empty">لا توجد إيصالات بعد. أنشئ أول إيصال قبض أو صرف.</div>'}`}
function rcpForm(k){const cs=S.cus.filter(c=>!c.off);const mo=dlg(k=='in'?'إيصال قبض':'إيصال صرف',`<label>${k=='in'?'العميل':'المورد / الجهة'}</label><select name="cid" id="rc"><option value="">— اختر —</option>${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>${k=='in'?'<label>ربط بفاتورة (اختياري)</label><select name="inv" id="ri"><option value="">بدون ربط</option></select>':''}<label>المبلغ</label><input name="a" type="number" inputmode="decimal"><label>التاريخ</label><input name="d" type="date" value="${today()}"><label>طريقة الدفع</label><select name="m"><option value="cash">نقدي</option><option value="bank">تحويل بنكي</option><option value="other">أخرى</option></select><label>الوصف</label><input name="desc">`,m=>{const cid=fv(m,'cid'),a=c2(fv(m,'a'));if(!cid){toast('اختر الجهة أولًا');return false}if(a<=0){toast('أدخل مبلغًا صحيحًا');return false}let iv=null;if(k=='in'&&fv(m,'inv')){iv=S.docs.find(x=>x.id==fv(m,'inv'));if(a>calc(iv).rest){toast('المبلغ أكبر من المتبقي على الفاتورة');return false}}const r={id:uid(),kind:k,no:String(++S.n[k=='in'?'rin':'rout']).padStart(4,'0'),date:fv(m,'d')||today(),cid,amt:a,m:fv(m,'m'),desc:fv(m,'desc'),cr:Date.now()};if(iv){r.inv=iv.id;iv.pays.push({a,d:r.date,r:r.id});autoStatus(iv)}S.rcp.push(r);save();toast('تم الحفظ ✓');viewR(r.id)});if(k=='in')$('#rc').onchange=()=>{const id=$('#rc').value;$('#ri').innerHTML='<option value="">بدون ربط</option>'+S.docs.filter(d=>d.type=='inv'&&d.cid==id&&!['draft','cancelled'].includes(d.status)&&calc(d).rest>0).map(d=>`<option value="${d.id}">فاتورة ${d.no} — المتبقي ${fm(calc(d).rest)}</option>`).join('')}}
function viewR(id){R=S.rcp.find(r=>r.id==id);tab='rview';render()}
function vRview(){const r=R,s=S.set,iv=r.inv?S.docs.find(d=>d.id==r.inv):null,i=r.kind=='in';return `<div class="np row" style="margin-bottom:10px;flex-wrap:wrap"><button class="b2" onclick="go('rcp')">رجوع</button><button onclick="print()">طباعة / PDF</button><button class="b2" style="color:var(--red)" onclick="delR()">حذف</button></div><div class="doc"><div class="hd"><div><h2>${esc(s.name||'اسم الشركة')}</h2><div style="font-size:12px;opacity:.85">${esc(s.phone)} ${esc(s.email)}<br>${esc(s.addr)}</div></div>${s.logo?`<img src="${s.logo}" alt="">`:''}</div><h3 style="margin:0;color:var(--navy)">${i?'إيصال قبض':'إيصال صرف'} رقم ${r.no}</h3><div class="meta"><div>${i?'استلمنا من':'صرفنا إلى'}<br><b>${esc(cname(r.cid))}</b></div><div>التاريخ<br><b>${r.date}</b></div><div>طريقة الدفع<br><b>${MT[r.m]||''}</b></div></div><div style="text-align:center;font-size:24px;font-weight:700;color:var(--navy);margin:16px 0">${fm(r.amt)}</div>${r.desc?`<p style="font-size:13px">البيان: ${esc(r.desc)}</p>`:''}${iv?`<p style="font-size:13px">عن الفاتورة رقم ${iv.no}</p>`:''}<p class="fine" style="text-align:center;border-top:1px solid #e5e7eb;padding-top:8px">${esc(S.set.foot)} فواتيري الذكي – MH</p></div>`}
function delR(){if(!confirm('حذف هذا الإيصال؟ سيُلغى أثره على الفاتورة المرتبطة.'))return;const iv=R.inv&&S.docs.find(d=>d.id==R.inv);if(iv){iv.pays=iv.pays.filter(p=>p.r!=R.id);autoStatus(iv)}S.rcp=S.rcp.filter(x=>x.id!=R.id);save();R=null;tab='rcp';render()}
// ---- more ----
function vMore(){const s=S.set,r=reports();return `<div class="card"><b>📊 التقارير</b><div class="fine">تعتمد على البيانات المسجلة في التطبيق وليست بديلًا عن نظام محاسبي أو ضريبي معتمد.</div><div class="grid" style="margin-top:8px"><div><label>من تاريخ</label><input type="date" value="${RF.from}" onchange="RF.from=this.value;render()"></div><div><label>إلى تاريخ</label><input type="date" value="${RF.to}" onchange="RF.to=this.value;render()"></div></div><label>العميل</label><select onchange="RF.cid=this.value;render()"><option value="">كل العملاء</option>${S.cus.map(c=>`<option value="${c.id}" ${RF.cid==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>حالة الفاتورة</label><select onchange="RF.st=this.value;render()"><option value="">الكل</option>${['issued','partial','paid','late'].map(k=>`<option value="${k}" ${RF.st==k?'selected':''}>${ST.inv[k]}</option>`).join('')}</select><div class="row" style="margin:8px 0"><button class="b2" onclick="RF={from:'',to:'',cid:'',st:''};render()">مسح الفلاتر</button><button class="b2" onclick="expR()">تصدير التقرير</button></div><div class="row" style="margin-top:8px"><span>إجمالي المبيعات</span><b>${fm(r.tot)}</b></div><div class="row"><span>مدفوعة بالكامل</span><b>${r.paid} فاتورة</b></div><div class="row"><span>غير مدفوعة/جزئية</span><b>${r.unp} فاتورة</b></div><div class="row"><span>إجمالي المستحق</span><b style="color:var(--org)">${fm(r.rest)}</b></div><div class="row"><span>المقبوض (إيصالات)</span><b>${fm(rcf('in'))}</b></div><div class="row"><span>المصروف (إيصالات)</span><b>${fm(rcf('out'))}</b></div>${r.top.length?'<hr><b class="fine">أعلى العملاء</b>'+r.top.map(t=>`<div class="row"><span>${esc(t[0])}</span><span>${fm(t[1])}</span></div>`).join(''):''}</div>
<div class="card"><b>🧾 إيصالات القبض والصرف</b><button class="b2" style="width:100%;margin-top:8px" onclick="go('rcp')">عرض الإيصالات</button></div><div class="card"><b>🏢 إعدادات الشركة</b><button class="b2" style="width:100%;margin-top:8px" onclick="setF()">رفع الشعار وتعديل بيانات الشركة والضريبة والعملة</button></div>
<div class="card"><b>💾 النسخ الاحتياطي</b><div class="fine">البيانات محفوظة على جهازك فقط. حذف بيانات المتصفح قد يمسحها، فاحتفظ بنسخة احتياطية.</div><div class="row" style="margin-top:8px"><button onclick="bk()">تصدير</button><button class="b2" onclick="imp()">استيراد</button></div></div>
<div class="card"><b>✨ الخدمات الذكية</b><div class="fine">ستتوفر لاحقًا عند ربط خدمة فعلية. لا توجد ميزات ذكاء اصطناعي مفعّلة في هذه النسخة.</div></div>`}
let RF={from:'',to:'',cid:'',st:''};function inR(d,c){return(!RF.from||d>=RF.from)&&(!RF.to||d<=RF.to)&&(!RF.cid||c==RF.cid)}
function rcf(k){return S.rcp.filter(r=>r.kind==k&&inR(r.date,r.cid)).reduce((a,r)=>a+r.amt,0)}
function expR(){const r=reports();const rows=['رقم,التاريخ,العميل,الإجمالي,المدفوع,المتبقي,الحالة'].concat(r.inv.map(d=>{const k=calc(d);return [d.no,d.date,cname(d.cid).replace(/,/g,' '),k.total/100,k.paid/100,k.rest/100,ST.inv[d.status]].join(',')}));dlg('تصدير التقرير','<textarea id="ex" rows="8" readonly>'+esc(rows.join('\n'))+'</textarea><div class="fine">اضغط على النص لنسخه ثم الصقه في Excel أو ملاحظات.</div>',null);$('#ex').onclick=function(){this.select();try{navigator.clipboard.writeText(this.value);toast('تم النسخ ✓')}catch(e){}}}
function reports(){const inv=S.docs.filter(d=>d.type==='inv'&&!['draft','cancelled'].includes(d.status)&&inR(d.date,d.cid)&&(!RF.st||d.status==RF.st));let tot=0,rest=0,paid=0,unp=0,by={};inv.forEach(d=>{const k=calc(d);tot+=k.total;rest+=k.rest;k.rest?unp++:paid++;const n=cname(d.cid);by[n]=(by[n]||0)+k.total});return{inv,tot,rest,paid,unp,top:Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3)}}
function setF(){const s=S.set;dlg('إعدادات الشركة',`<label>اسم الشركة</label><input name="name" value="${esc(s.name)}"><label>الهاتف</label><input name="phone" value="${esc(s.phone)}"><label>البريد</label><input name="email" value="${esc(s.email)}"><label>العنوان</label><input name="addr" value="${esc(s.addr)}"><label>العملة</label><input name="cur" value="${esc(s.cur)}"><label>نسبة الضريبة الافتراضية %</label><input name="tax" type="number" value="${s.tax}"><label>شروط الدفع الافتراضية</label><input name="terms" value="${esc(s.terms)}"><label>ملاحظة أسفل المستندات</label><input name="foot" value="${esc(s.foot)}"><label>شعار الشركة</label>${s.logo?`<div class="row" style="margin-bottom:6px"><img src="${s.logo}" alt="" style="height:56px;max-width:140px;object-fit:contain;border:1px solid var(--bd);border-radius:8px"><button class="b2" onclick="S.set.logo='';save();this.closest('.mod').remove();setF()">إزالة الشعار</button></div>`:'<div class="fine">لم يُرفع شعار بعد. اختر صورة (PNG أو JPG).</div>'}<input type="file" accept="image/*" name="lg">`,m=>{Object.assign(s,{name:fv(m,'name'),phone:fv(m,'phone'),email:fv(m,'email'),addr:fv(m,'addr'),cur:fv(m,'cur')||'ج.م',tax:parseFloat(fv(m,'tax'))||0,terms:fv(m,'terms'),foot:fv(m,'foot')});const f=m.querySelector('[name=lg]').files[0];const fin=()=>{save();toast('تم الحفظ ✓');render()};if(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,300/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);s.logo=c.toDataURL('image/png');fin()};im.onerror=()=>{toast('تعذر قراءة الصورة');fin()};im.src=r.result};r.readAsDataURL(f)}else fin()})}
function bk(){dlg('نسخة احتياطية','<div class="fine">انسخ النص واحفظه في مكان آمن (ملاحظات أو رسالة لنفسك).</div><textarea id="bt" rows="8" readonly>'+esc(JSON.stringify(S))+'</textarea>',null);$('#bt').onclick=function(){this.select();try{navigator.clipboard.writeText(this.value);toast('تم النسخ ✓')}catch(e){}}}
function imp(){dlg('استيراد نسخة احتياطية','<textarea name="j" rows="8" placeholder="الصق نص النسخة الاحتياطية هنا"></textarea><div class="fine">سيستبدل هذا بياناتك الحالية.</div>',m=>{try{const o=JSON.parse(fv(m,'j'));if(!o.docs||!o.cus)throw 0;if(!confirm('استبدال كل البيانات الحالية؟'))return false;S=Object.assign(S,o);S.rcp=S.rcp||[];S.n.rin=S.n.rin||0;S.n.rout=S.n.rout||0;save();toast('تم الاستيراد ✓');render()}catch(e){toast('نص غير صالح');return false}},'استيراد')}
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
idb().then(load).then(()=>{S.rcp=S.rcp||[];S.n.rin=S.n.rin||0;S.n.rout=S.n.rout||0;if(!S.set.name&&!S.docs.length)setTimeout(()=>{tab='home'},0);render()});
</script>
